{% extends "app_base.html" %}
{% block title %}Alterar Senha{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Alterar Senha</h1>
    <p class="page-subtitle">// segurança da conta</p>
  </div>
  <a href="{{ url_for('main.profile') }}" class="btn btn-ghost">← Voltar</a>
</div>

<div class="page-body">
  <div style="max-width:420px;">
    <div class="card">
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="form-group">
          <label for="current_password">Senha atual</label>
          <input id="current_password" name="current_password" type="password"
                 placeholder="••••••••" required autocomplete="current-password">
        </div>

        <div class="form-group">
          <label for="new_password">Nova senha</label>
          <input id="new_password" name="new_password" type="password"
                 placeholder="••••••••" required minlength="6" autocomplete="new-password">
          <p class="form-hint">Mínimo 6 caracteres.</p>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirmar nova senha</label>
          <input id="confirm_password" name="confirm_password" type="password"
                 placeholder="••••••••" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary w-full" style="justify-content:center;padding:13px;">
          Salvar nova senha
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
